# pixi.toml - Modern package management for conda + PyPI
# Pixi is the recommended tool for computational biology because it handles
# both conda packages (samtools, bedtools, etc.) and PyPI packages seamlessly.
#
# See: https://pixi.sh/
#
# Quick start:
#   pixi install          # Create environment and install dependencies
#   pixi install -e docs  # Add Quarto/plotting stack (only needed to render docs/notebooks)
#   pixi run test         # Run tests
#   pixi run lint         # Check code style
#   pixi shell            # Activate environment

[workspace]
name = "mutation_call_variability"
version = "0.1.0"
description = "Investigating mutation call performance as a function of cell count"
authors = ["CBG-ETH Zurich <cbg@ethz.ch>"]
channels = ["conda-forge"]
platforms = ["linux-64"]#, "osx-64", "osx-arm64"]

# =============================================================================
# Default dependencies - runtime + everyday dev tooling + Snakemake workflow.
# Kept intentionally lean: this is what `pixi install` resolves and builds by
# default, so only the docs/notebook stack (Quarto/Jupyter/plotting) is opted
# out into the `docs` feature below.
# =============================================================================

[dependencies]
python = "==3.12.0"

# Runtime - actually imported by src/mutation_call_variability
numpy = ">=1.24"
polars = ">=0.20"
pandas = ">=2.0,<3"  # <3: DemoTape (demultiplex_distance.py) uses DataFrame.applymap, removed in pandas 3
loompy = ">=3.0.6"
pyyaml = ">=6.0"
pydantic = ">=2.0"

# Dev tools (lightweight, pure-Python - negligible resolve cost)
pytest = ">=7.0"
pytest-cov = ">=4.0"
hypothesis = ">=6.0"
ruff = ">=0.8.0"
pre-commit = ">=3.0"
mypy = ">=1.0"      # Used in CI/pre-commit for stability
pyright = ">=1.1"   # Used locally for fast feedback
memray = ">=1.19.3,<2"
quarto = ">=1.4"
ipykernel = ">=6.0"    # Required for Quarto to find a Python kernel
nbclient = ">=0.5"     # Required by quarto's jupyter engine to execute notebooks
matplotlib = ">=3.7"
seaborn = ">=0.12"
scipy = ">=1.10"       # notebooks/read_model.qmd
pymc = ">=5.10"        # notebooks/read_model.qmd
arviz = ">=0.17"       # notebooks/read_model.qmd

[pypi-dependencies]
# Install the package itself in editable mode
mutation_call_variability = { path = ".", editable = true }

# Docstring coverage checker (lightweight)
interrogate = ">=1.5"

# Snakemake from PyPI (more reliable cross-platform than conda)
snakemake = ">=8.0"

# SLURM executor plugin, so `pixi run workflow` can submit rules as SLURM jobs
snakemake-executor-plugin-slurm = ">=2.0"

# Pinned below 0.6.1: that release strips SLURM_MEM_* env vars before the
# nested srun call (meant to fix a GPU-only conflict), which silently drops
# the job's real memory allocation and falls back to the cluster's tiny
# default-mem-per-cpu for every job, GPU or not.
# https://github.com/snakemake/snakemake-executor-plugin-slurm-jobstep
snakemake-executor-plugin-slurm-jobstep = "<0.6.1"

# =============================================================================
# Optional features - only resolved/installed when explicitly requested via
# `pixi install -e <name>` or `pixi run -e <name> <task>`.
# =============================================================================



# # Render presentation slides
# slides = "quarto render docs/slides.qmd"

# # Publish documentation to GitHub Pages
# docs-publish = "quarto publish gh-pages docs/ --no-prompt"

# [environments]
# docs = ["docs"]

# =============================================================================
# Tasks - Custom commands accessible via `pixi run <task>`
# =============================================================================

[tasks]
# Register Jupyter kernel for Quarto
kernel = "python -m ipykernel install --user --name python3 --display-name 'Python 3 (mutation_call_variability)'"

# Render all Quarto notebooks; thanks to notebooks/_quarto.yml (freeze: auto),
# only notebooks whose source changed are re-executed.
notebooks = { cmd = "quarto render notebooks", depends-on = ["kernel"] }

# Run tests
test = "pytest tests/ -v"

# Run tests with coverage
test-cov = "pytest tests/ --cov=src/mutation_call_variability --cov-report=term-missing"

# Run linter
lint = "ruff check src/ tests/"

# Auto-fix lint issues
lint-fix = "ruff check src/ tests/ --fix"

# Format code
format = "ruff format src/ tests/"

# Check formatting without changing files
format-check = "ruff format src/ tests/ --check"

# Type checking - pyright for local dev (fast), mypy for CI (stable)
typecheck = "pyright src/"           # Default: fast local feedback
typecheck-strict = "pyright src/ --level strict"  # Stricter checking
typecheck-ci = "mypy src/"           # Used in CI/pre-commit

# Docstring coverage
docstring-cov = "interrogate src/ -v --fail-under=80"

# Run all quality checks (uses mypy for CI compatibility)
check = { depends-on = ["lint", "format-check", "typecheck-ci", "docstring-cov", "test"] }

# Install pre-commit hooks
hooks = "pre-commit install"

# Run pre-commit on all files
hooks-all = "pre-commit run --all-files"

# Run Snakemake workflow (dry run)
workflow-dry = "snakemake -n --profile workflow/profiles --snakefile workflow/Snakefile"

# Run Snakemake workflow, submitting rules as SLURM jobs
workflow = "snakemake --executor slurm --jobs 300 --profile workflow/profiles --printshellcmds --snakefile workflow/Snakefile" # --config workflow/config/params.yaml

# Pool simulation workflow: simulate pools over the n_same x n_diff grid,
# demultiplex with DemoTape, compute ARIs and plot them
pool-grid-dry = "snakemake -n --profile workflow/profiles --snakefile workflow/pool_simulation/Snakefile"
pool-grid = "snakemake --jobs 300 --profile workflow/profiles --printshellcmds --snakefile workflow/pool_simulation/Snakefile"


# Clean generated files
clean = "rm -rf results/*.parquet docs/*.html .pytest_cache .mypy_cache .ruff_cache"

